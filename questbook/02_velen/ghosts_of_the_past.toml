#
# Template: T_keira = ManualSave_568ef_7ea51000_923cb5 (sq102 not started yet). Both donors were played from
# T_letho (ManualSave_6b9be_7ea51000_9bb30d, a later save of the same playthrough), so each effect is a
# CLOSURE: the diff from T_keira to the donor, which also removes the quest's start triggers that still wait
# on T_keira (72a761d5, 15601b24, 8fdb44ab; docs/plan/decision-chaining.md, section C). The donors' NM names
# do not extend the template's: export needs `allow_name_remap`. Captured with
# `w3al graph-diff T_keira DONOR --stub-id --toml KEY --scope ...` on the quest's own nodes only (scene entries
# `letho` and `sq102_dolores`; b531a276, b8f04d50 and, for "elsewhere", thread 6850c728 of hub 279a1a03; the
# spawn sets letho / sq102_*; the stubs of Letho, Dolores and the evictor); journal: `journal-diff --grep letho`
# and `--grep sq102dolores`; facts: the donor's `q402_*` / `sq102_*` facts with records, `*_hit*` left out,
# multi-record facts summed. The invited effect equals gate X1's Letho delta (C:\w3-out\gate_X\deltas).
# Each donor also carries a side outcome inside the quest: invited = headhunters let go
# (`sq102_let_headhunters_go`), elsewhere = headhunters killed (`sq102_killed_headhunters`).
#
# template: T_keira = ManualSave_568ef_7ea51000_923cb5 for `invited` / `elsewhere` (graph closures above);
# template: T_letho = ManualSave_6b9be_7ea51000_9bb30d (pack 14, 5.01 re-save) for `abandoned` (synth walk below).
# The per-window template mechanism is not built yet: on T_keira the `abandoned` walk is refused at export (its start
# 2da9cd80 is not waiting there), on T_letho the closures' guards do not match. Decision D4 (help Letho or not) is the
# third option of the same choice because it excludes D5: a Letho who is left behind is never sent anywhere.
# D4 in the graph (sq102_letho.w2phase): refusing at the farm (scene 4ad6d8f9 `NotHelp` -> `sq102_told_letho_not_helping`)
# only changes journal lines; the quest really ends "Lost Letho" when Geralt leaves him (`LostLetho` on the ride,
# 844eee73 distance > 1200, or `AbandonedLetho` from Letho's Trick f43ea017: scene 70d40ee9 `Fight`, then 22f54f6c
# "outside sq102_tr_approaching_midcotts") -> phase f19f767a: `sq102_didnt_help_letho`, `sq102_lost_letho`, journal
# Failure, Letho's spawn sets off. T_letho is already past the farm (Letho rides to Midcots), so the branch walked here
# is the abandonment at Midcots. Read later by the q402 Letho ally phase (no Letho at Kaer Morhen).
id = "ghosts_of_the_past"
title = "Ghosts of the Past"
act = 2
order = 2310
kind = "secondary"
region = "velen"
level = 6                 # from the game's quest-level table
summary = """A widow's notice brings you to a farmstead full of traps and a guest who was never \
supposed to be found. Bounty hunters close in on him, and once the dust settles you decide where \
an old enemy goes to wait out the war."""

[[choices]]
id = "letho"
prompt = "Letho needs a place to hide. Where do you send him?"
default = "kaer_morhen"
options = [
  { id = "kaer_morhen", text = "Invite him to Kaer Morhen (you let the hunters walk)", effects = "invited" },
  { id = "elsewhere",   text = "Tell him to go elsewhere (the hunters die)",           effects = "elsewhere" },
  { id = "abandoned",   text = "Walk away when the hunters come for him (Letho is lost for good and never reaches Kaer Morhen)", effects = "abandoned" },
]

[effects.invited]
source = "save diff ManualSave_568ef_7ea51000_923cb5 -> ManualSave_52584_7ea51000_a4841f (w3al journal-diff, facts --diff, graph-diff --stub-id --toml)"
placeholder = false
facts = { q402_invited_letho_to_km = 1, sq102_arrow_trap_triggered = 1, sq102_blacksmith_evicted = 1, sq102_dolores_diary_found = 1, sq102_dolores_gave_quest = 1, sq102_entered_farmstead = 1, sq102_first_arrow_trap_unique = 1, sq102_first_trap_unique = 1, sq102_first_viper_unique = 1, sq102_go_find_ladder = 1, sq102_helped_letho = 1, sq102_hide_community = 0, sq102_humberts_corpse_found = 2, sq102_ladder_found = 1, sq102_let_headhunters_go = 1, sq102_letho_completed = 1, sq102_letho_lost_medallion = 1, sq102_letho_met = 1, sq102_lockbox_contents_obtained = 1, sq102_loose_papers_found = 1, sq102_loose_plank_found = 1, sq102_next_traps_unique = 1, sq102_portrait_found = 1, sq102_sound_source_found = 1, sq102_suspend_1003 = 1, sq102_trap_disarmed = 1, sq102_traps_set_off = 2, sq102_traps_triggered = 1, sq102_tripwire_disarmed = 1, sq102_weak_wall_found = 1 }

