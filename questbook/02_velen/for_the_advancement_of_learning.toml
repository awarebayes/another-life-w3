# from it (C:\w3-fixtures\session_V1, BRANCHES.txt); the effects only apply to that template (graph guards).
# Facts: the donor's new quest facts; left out as noise: dialogue ids (128726629_*), timers and *_hit*
# facts, tutorials, statistics, achievements, `mh305_merchant_spawned` (a merchant spawned before the talk),
# and the `_by_GERALT` / `_by_PLAYER` kill facts. The donors also REMOVE `keira_part1_dd_start`, which the
# schema cannot express yet (no fact removal): it stays in the template's state (docs/plan/prototype-velen.md).
