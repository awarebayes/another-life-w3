# 215f2719 leaves; d5740aa4 and the branch block/thread arrive), the listener blocks 7ffa6436 / 973a4357, the
# scene entry `keira`, the spawn set `keira_metz.w2comm` and her stub (by idTag); timers and toggling scopes
# (also changed in the null saves) are noise (docs/plan/decision-chaining.md, section A).
id = "for_the_advancement_of_learning"
title = "For the Advancement of Learning"
act = 2
order = 2300
kind = "secondary"
region = "velen"
level = 11                # TODO(phase3): verify the recommended level in game
summary = """The sorceress from the bog has been digging through a mage's tower for more than \
curiosity. Once her real plan is out in the open, she asks you to look the other way. What you \
say decides where she spends the coming war."""

[[choices]]
id = "keira"
prompt = "Keira wants to take what she found to the king's court. What do you do?"
default = "kaer_morhen"
options = [
  { id = "kaer_morhen", text = "Talk her into going to Kaer Morhen instead", effects = "to_kaer_morhen" },
  { id = "radovid",     text = "Let her go to Radovid",                       effects = "to_radovid" },
  { id = "killed",      text = "Stop her with your sword",                    effects = "killed" },
]

# Kaer Morhen and Radovid: donors saved right after the talk (the quest log still shows q109 Active);
# killed: donor saved after the fight (q109 Success, tracked quest moved to the main quest).

