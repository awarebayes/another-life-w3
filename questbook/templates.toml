# Template registry (schema: questbook/SCHEMA.md "Template registry"; design: docs/plan/story-chain.md).
#
# One entry per decision-window template: a real 5.01 save parked before the window's decisions. The player's
# saves are never part of the repo: export finds `<stem>.sav` in the template folders (run `template_dirs`, the
# app's Templates folder, default `templates` next to this questbook folder). All templates sit on one line, the
# Nexus 2394 pack playthrough (`line` = pack save number, C:\w3-fixtures\pack_501\PACKS.txt and
# session_V1\BRANCHES.txt).
#
# `encodes` = what the save already holds for earlier quests. Derived with `w3al template-scan` (every answer
# combination of the earlier window exported on that window's own template, matched against this save by the facts
# that vary between the combinations; mismatches quoted below are transient facts later play removed), never typed
# by hand. Exceptions, marked in place: a_favor_for_a_friend (no 5.01 window template to scan; read off the saves
# with `w3al facts`) and kings_gambit (the pack played the Cerys trial, which is not a questbook option: `in_game`).
#
# `fixed` = earlier answers that cannot be changed on this template, with the reason. Keys: `quest` (any change),
# `quest.choice`, `quest.choice=option`. Evidence: `w3al template-scan` reader states (a reader quest that branched on
# the decision has run) and docs/plan/decision-catalogue.md section 2; table in docs/plan/story-chain.md section 3.

