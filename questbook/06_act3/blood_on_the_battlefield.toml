  { id = "snowball", text = "Pelt her with snowballs until she laughs (counts toward Ciri's survival at the end)", effects = "snowball" },
  { id = "talk",     text = "Sit down and talk it through (counts against Ciri's survival at the end)",          effects = "talk" },
]

[[choices]]
id = "ride"
prompt = "Ciri wants to see her father in Vizima. Do you ride with her?"
default = "imlerith"
