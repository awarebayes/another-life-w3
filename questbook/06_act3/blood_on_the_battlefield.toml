  { id = "emhyr",    text = "Ride with her to the emperor (needed for the ending where Ciri takes the throne)",   effects = "to_vizima" },
  { id = "imlerith", text = "Go straight after Imlerith instead (Ciri never sees Emhyr; no reward question)",  effects = "to_imlerith" },
]

[[choices]]
id = "reward"
prompt = "Only if you rode to Vizima: the emperor offers you payment for finding his daughter. What do you do?"
default = "none"
options = [
  { id = "refuse", text = "Refuse the money (counts toward Ciri's survival at the end); needs the Vizima ride",           effects = "refused_reward" },
  { id = "accept", text = "Take the money (counts against Ciri's survival at the end); needs the Vizima ride",            effects = "accepted_reward" },
  { id = "none",   text = "No audience: you went after Imlerith, or you leave it to play in game (the save then stops at the audience)" },
]

