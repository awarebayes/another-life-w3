name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versions in sync (Cargo.toml and tauri.conf.json)
        shell: pwsh
        run: ./scripts/check-version.ps1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
      - name: Test (fixture tests skip without W3AL_FIXTURES)
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Lint questbook
        run: cargo run --locked -p w3al-cli -- lint

  app:
    # Compiles the Tauri shell (WebView2 is preinstalled on the runner). No installer:
    # the template saves are not in git, so a release build is done locally.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build app crate
        run: cargo build --locked -p w3al-app
